services:
  nginx:
    restart: unless-stopped
    volumes:
      - ../server/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - certbot-certs:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot:ro
      - web-root:/srv/web:ro

  letsencrypt:
    volumes:
      - certbot-certs:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot

  api:
    restart: unless-stopped

  worker:
    restart: unless-stopped

  beat:
    restart: unless-stopped

volumes:
  api-data:
    external: true
    name: goosenest-codex-profiles-api_codex-profiles

  redis-data:
    external: true
    name: goosenest-codex-profiles-api_redis-data

  postgres-data:
    external: true
    name: goosenest-codex-profiles-api_postgres-data

  certbot-certs:
    external: true
    name: goosenest-codex-profiles-api_certbot-certs

  certbot-webroot:
    external: true
    name: goosenest-codex-profiles-api_certbot-webroot

  web-root:
