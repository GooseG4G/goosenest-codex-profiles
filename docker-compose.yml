name: goosenest-codex-profiles

x-logging: &x-logging
  driver: json-file

  options:
    max-size: 16m
    max-file: "5"

x-api-environment: &x-api-environment
  # PostgreSQL Config
  ## Connection
  POSTGRES_HOST: "${POSTGRES_HOST:-postgres}"
  POSTGRES_PORT: "${POSTGRES_PORT:-5432}"
  POSTGRES_DATABASE: "${POSTGRES_DATABASE:-codex-profiles}"

  ## Authentication
  POSTGRES_USERNAME: "${POSTGRES_USERNAME:-codex-profiles}"
  POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set}"

  # Redis Config
  ## Connection
  REDIS_HOST: "${REDIS_HOST:-redis}"
  REDIS_PORT: "${REDIS_PORT:-6379}"

  ## Authentication
  REDIS_USERNAME: "${REDIS_USERNAME:-codex-profiles}"
  REDIS_PASSWORD: "${REDIS_PASSWORD:?REDIS_PASSWORD is not set}"

  ## Databases
  REDIS_BROKER_DATABASE: "${REDIS_BROKER_DATABASE:-0}"
  REDIS_BACKEND_DATABASE: "${REDIS_BACKEND_DATABASE:-1}"

  # Bootstrap Administrator Config
  ## Identity
  BOOTSTARTUP_USERNAME: "${BOOTSTARTUP_USERNAME:-administrator@example.com}"
  BOOTSTARTUP_NICKNAME: "${BOOTSTARTUP_NICKNAME:-Administrator}"

  ## Authentication
  BOOTSTARTUP_PASSWORD: "${BOOTSTARTUP_PASSWORD:?BOOTSTARTUP_PASSWORD is not set}"

  # OpenAI Config
  ## Connection
  OPENAI_RESPONSES_URL: "${OPENAI_RESPONSES_URL:-https://chatgpt.com/backend-api/codex/responses}"

  ## Timeouts
  OPENAI_REQUEST_TIMEOUT: "${OPENAI_REQUEST_TIMEOUT:-300}"

  # Codex Config
  ## Runtime
  CODEX_EXECUTABLE: "${CODEX_EXECUTABLE:-codex}"

  ## Storage
  CODEX_PROFILES_ROOT: /data/codex-profiles

  ## Scheduling
  PROFILE_WEEKLY_RESERVE_PERCENT: "${PROFILE_WEEKLY_RESERVE_PERCENT:-25}"
  PROFILE_SCORE_TOLERANCE: "${PROFILE_SCORE_TOLERANCE:-0.05}"
  PROFILE_AFFINITY_MINUTES: "${PROFILE_AFFINITY_MINUTES:-20}"
  PROFILE_MAX_ATTEMPTS: "${PROFILE_MAX_ATTEMPTS:-3}"

  # Session Config
  ## Lifetime
  SESSION_TTL_DAYS: "${SESSION_TTL_DAYS:-30}"

  ## Cookie
  SESSION_COOKIE_SECURE: "${SESSION_COOKIE_SECURE:-true}"

  # Usage Task Config
  ## Retries
  USAGE_TASK_MAX_RETRIES: "${USAGE_TASK_MAX_RETRIES:-2}"
  USAGE_TASK_MIN_RETRY_DELAY: "${USAGE_TASK_MIN_RETRY_DELAY:-5}"
  USAGE_TASK_MAX_RETRY_DELAY: "${USAGE_TASK_MAX_RETRY_DELAY:-30}"

x-api-service: &api-service
  build:
    context: ./api
    dockerfile: .dockerfile

  image: goosenest/codex-profiles-api:latest
  restart: always

  depends_on:
    postgres:
      condition: service_healthy

    redis:
      condition: service_healthy

  environment: *x-api-environment

  volumes:
    - api-data:/data

  logging: *x-logging

services:
  nginx:
    image: nginx:1.29-alpine
    restart: always

    depends_on:
      api:
        condition: service_healthy

      web:
        condition: service_completed_successfully

    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./letsencrypt/etc:/etc/letsencrypt:ro
      - ./letsencrypt/www:/var/www/certbot:ro
      - web-root:/srv/web:ro

    mem_limit: 64m

    logging: *x-logging

  letsencrypt:
    image: certbot/certbot:latest
    restart: "no"

    profiles:
      - maintenance

    command: [
      "renew", "--webroot",
      "--webroot-path", "/var/www/certbot",
    ]

    volumes:
      - ./letsencrypt/etc:/etc/letsencrypt
      - ./letsencrypt/www:/var/www/certbot

  web:
    build:
      context: ./web
      dockerfile: .dockerfile

    image: goosenest/codex-profiles-web:latest
    restart: "no"

    volumes:
      - web-root:/srv/web

    mem_limit: 64m
    logging: *x-logging

  api:
    <<: *api-service
    command: [
      "uvicorn", "main:app",
      "--host", "0.0.0.0",
      "--port", "8000",
    ]

    healthcheck:
      test: [
        "CMD", "curl", "http://localhost:8000/health",
        "--fail", "--silent", "--show-error",
      ]

      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s

    mem_limit: 192m

  worker:
    <<: *api-service
    command: [
      "celery",
      "-A", "worker.worker:app", "worker",
      "--loglevel=info",
      "--prefetch-multiplier=1",
      "--queues=default,codex",
      "--concurrency=1",
      "--max-tasks-per-child=25",
    ]

    mem_limit: 384m

  beat:
    <<: *api-service
    command: [
      "celery",
      "-A", "worker.worker:app", "beat",
      "--loglevel=info",
      "--schedule", "/data/celerybeat-schedule",
    ]

    mem_limit: 96m

  redis:
    image: redis:7-alpine
    restart: always

    entrypoint: [
      "/bin/sh",
      "/usr/local/bin/entrypoint.sh",
    ]

    command: [
      "--appendonly", "yes",
      "--appendfsync", "everysec",
      "--maxmemory", "48mb",
      "--maxmemory-policy", "noeviction",
      "--save", "900", "1",
      "--save", "300", "10",
      "--save", "60", "10000",
      "--stop-writes-on-bgsave-error", "yes",
      "--dir", "/data",
    ]

    environment:
      REDIS_USERNAME: "${REDIS_USERNAME:-codex-profiles}"
      REDIS_PASSWORD: "${REDIS_PASSWORD:?REDIS_PASSWORD is not set}"

    healthcheck:
      test: [
        "CMD-SHELL",
        "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli --user \"$${REDIS_USERNAME}\" ping | grep -q PONG",
      ]

      interval: 5s
      timeout: 3s
      retries: 30

    volumes:
      - redis-data:/data
      - ./redis/entrypoint.sh:/usr/local/bin/entrypoint.sh:ro

    mem_limit: 64m

    logging: *x-logging

  postgres:
    image: postgres:17-alpine
    restart: always

    environment:
      POSTGRES_DB: "${POSTGRES_DATABASE:-codex-profiles}"
      POSTGRES_USER: "${POSTGRES_USERNAME:-codex-profiles}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set}"

    command: [
      "postgres",
      "-c", "shared_buffers=64MB",
      "-c", "work_mem=1MB",
      "-c", "maintenance_work_mem=32MB",
      "-c", "max_connections=30",
    ]

    healthcheck:
      test: [
        "CMD-SHELL",
        "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""
      ]

      interval: 5s
      timeout: 3s
      retries: 30

    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/scheme.sql:/docker-entrypoint-initdb.d/001-scheme.sql:ro

    mem_limit: 192m

    logging: *x-logging

volumes:
  api-data:
  web-root:

  redis-data:
  postgres-data:
