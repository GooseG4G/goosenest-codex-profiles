name: goosenest-codex-profiles-api

x-environment: &x-environment
  # PostgreSQL
  POSTGRES_HOST: "${POSTGRES_HOST:-postgres}"
  POSTGRES_PORT: "${POSTGRES_PORT:-5432}"
  POSTGRES_DATABASE: "${POSTGRES_DATABASE:-codex-profiles}"
  POSTGRES_USERNAME: "${POSTGRES_USERNAME:-codex-profiles}"
  POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-codex-profiles}"
  BOOTSTARTUP_USERNAME: "${BOOTSTARTUP_USERNAME:-administrator@example.com}"
  BOOTSTARTUP_NICKNAME: "${BOOTSTARTUP_NICKNAME:-Administrator}"
  BOOTSTARTUP_PASSWORD: "${BOOTSTARTUP_PASSWORD:?Set BOOTSTARTUP_PASSWORD}"
  OPENAI_RESPONSES_URL: "${OPENAI_RESPONSES_URL:-https://chatgpt.com/backend-api/codex/responses}"
  CODEX_PROFILES_ROOT: "/data/codex-profiles"
  REDIS_URL: "${REDIS_URL:-redis://redis:6379}"
  REDIS_BROKER_DATABASE: "${REDIS_BROKER_DATABASE:-0}"
  REDIS_BACKEND_DATABASE: "${REDIS_BACKEND_DATABASE:-1}"
  USAGE_TASK_MAX_RETRIES: "${USAGE_TASK_MAX_RETRIES:-2}"
  USAGE_TASK_MIN_RETRY_DELAY: "${USAGE_TASK_MIN_RETRY_DELAY:-5}"
  USAGE_TASK_MAX_RETRY_DELAY: "${USAGE_TASK_MAX_RETRY_DELAY:-30}"

x-app-service: &x-app-service
  build:
    context: .
    dockerfile: .dockerfile
  image: goosenest/codex-profiles-api:latest
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  volumes:
    - .:/app
    - codex-profiles:/data/codex-profiles
  environment: *x-environment

services:
  web:
    build:
      context: ../web
    image: goosenest/codex-profiles-web:latest
    container_name: goosenest-codex-profiles-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"

  api:
    <<: *x-app-service
    container_name: goosenest-codex-profiles-api
    command: [
      "uvicorn", "app.main:app", 
      "--host", "0.0.0.0", 
      "--port", "8000", 
      "--reload"
    ]

    healthcheck:
      test: [ 
        "CMD", "python", "-c",
        "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      ]

      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s

  worker:
    <<: *x-app-service
    container_name: goosenest-codex-profiles-worker
    command: [
      "celery", "-A", "app.worker.worker:app", "worker",
      "--loglevel=info", "--prefetch-multiplier=1",
      "--queues=default,codex",
      "--concurrency=${CELERY_WORKER_CONCURRENCY:-2}"
    ]

  beat:
    <<: *x-app-service
    container_name: goosenest-codex-profiles-beat
    command: [
      "celery", "-A", "app.worker.worker:app", "beat",
      "--loglevel=info"
    ]

  redis:
    image: redis:7-alpine
    container_name: goosenest-codex-profiles-redis
    restart: unless-stopped
    command: [
      "redis-server",
      "--appendonly", "yes",
      "--appendfsync", "everysec"
    ]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 3s
    volumes:
      - redis-data:/data

  postgres:
    image: postgres:17-alpine
    container_name: goosenest-codex-profiles-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: "${POSTGRES_DATABASE:-codex-profiles}"
      POSTGRES_USER: "${POSTGRES_USERNAME:-codex-profiles}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Error}"

    healthcheck:
      test: [
        "CMD", "pg_isready", 
        "-U", "${POSTGRES_USERNAME:-codex-profiles}", 
        "-d", "${POSTGRES_DATABASE:-codex-profiles}"
      ]

      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s

    volumes:
      - ./postgres/data:/var/lib/postgresql/data
      - ./postgres/scheme.sql:/docker-entrypoint-initdb.d/001-scheme.sql:ro

volumes:
  codex-profiles:
  redis-data:
